

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "kafka:29092", "1", "5"]
      interval: 10s
      timeout: 5s
      retries: 5

  model_downloader:
    build: .
    container_name: model_downloader
    command: python scripts/download_models.py
    volumes:
      - huggingface_cache:/huggingface_cache

  model_server:
    build: .
    container_name: model_server
    depends_on:
      model_downloader:
        condition: service_completed_successfully
    command: uvicorn model_server.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
      - huggingface_cache:/huggingface_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-setup:
    build: .
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/bin/sh", "/app/kafka-setup.sh"]


  axion_agents:
    build: .
    container_name: axion_agents
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      model_server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -u supervisor.py

  ui_agent:
    build: .
    container_name: ui_agent
    depends_on:
      - axion_agents
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: streamlit run ui/app.py

volumes:
  huggingface_cache: